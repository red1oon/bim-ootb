<html lang="en">
<head>
<meta charset="utf-8">

<title>PDF: view and read as a sheet</title>
<style>

  button { cursor: pointer; } button:disabled { opacity: .45; cursor: default; } button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #stat { color: var(--mute); flex: 1 1 200px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #grid th { color: var(--mute); font-weight: 500; background: var(--bg); position: sticky; top: 0; } #grid td.n { text-align: right; font-variant-numeric: tabular-nums; }
  #grid td.f { font-weight: 600; } #grid td:hover { background: var(--hit); }

  #hist-say { padding: 3px 4px; overflow-wrap: anywhere; } #hist-say.bad { color: var(--bad); } #hist-say.good { color: var(--good); }
  #hist-ask { display: flex; gap: 4px; padding: 4px; } #hist-ask input { flex: 1 1 0; min-width: 0; } #hist-story div { padding: 2px 4px; font-size: 12.5px; overflow-wrap: anywhere; }

</head>
<body>
<header>
  <b>PDF</b>
  <button id="b-open" class="primary">Open a PDF</button>
  <input id="file" type="file" accept="application/pdf,.pdf" hidden>
  <span id="pw"><input id="pw-in" type="password" placeholder="Password" autocomplete="off"><button id="pw-go">Unlock</button></span>
  <input id="q" type="search" placeholder="Find text" disabled>
  <button id="b-sheet" disabled>Read as sheet</button>
  <button id="b-xlsx" disabled>Download .xlsx</button>
  <button id="b-pdf" disabled>Download PDF</button>
  <span id="stat">Nothing is uploaded: the file stays on this device.</span>
</header>
<main id="main">
  <aside><h3>Outline</h3><div id="outline"><div class="none">No file open</div></div><h3>Found</h3><div id="hits"><div class="none">Type in Find text</div></div>
    <h3>History</h3><div id="hist-say" class="none">No file open</div><div id="hist-ask"><input id="hist-cell" type="search" placeholder="Cell, e.g. D10" aria-label="Cell whose history to show" disabled><button id="hist-go" disabled>Story</button></div><div id="hist-story"></div></aside>
  <section id="pages"><div id="drop">Open a PDF, or drop one here.<br>Reports with a table can be read as a sheet and checked that they add up.<br>Change a number in the sheet and the same PDF comes back with it.</div></section>
  <section id="sheet"><div id="verdict"></div><table id="grid"></table></section>
</main>
