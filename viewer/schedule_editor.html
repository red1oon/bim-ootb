<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>BIM OOTB — Schedule Editor (WBS + Dependencies)</title>
<!--
  §SE-1 — the MSP-grade Gantt editor, NEW-TAB surface (§SE-C). Step 1+2: collapsible WBS outline +
  dependency view/edit. Open with ?db=<building.db>&… (config.js parity: defaults to Duplex on GH
  Pages, the OCI bucket DB when hosted there). All graph logic lives in schedule_author.js (engine,
  node-tested W-SCHED-EDIT); this page is the surface.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.45 -apple-system, Segoe UI, Roboto, sans-serif;
         background: #11151c; color: #d8e0ea; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
           background: linear-gradient(180deg, #1b2230, #161b25); border-bottom: 1px solid #2a3342; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; color: #eaf1fb; }
  header .sub { color: #7d8aa0; font-size: 11px; }
  #se-import-btn { margin-left: auto; background: #243042; border: 1px solid #34465e; color: #cdd7e4;
    font-size: 12px; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
  #se-import-btn:hover { background: #2c3a50; }
  #se-bld { color: #4fc3f7; font-size: 11px; margin-left: 12px; }
  #se-status { padding: 6px 16px; background: #0d1118; color: #9fb0c6; font-size: 11px;
               border-bottom: 1px solid #222b38; min-height: 26px; }
  main { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(340px, 1.2fr); gap: 0;
         height: 42vh; border-bottom: 1px solid #232c3a; }
  .pane { overflow: auto; padding: 10px 12px; }
  .pane.left { border-right: 1px solid #232c3a; }
  .pane h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #6f7d93;
             margin: 0 0 8px; }
  /* WBS outline */
  .se-wbs-row { display: flex; align-items: center; gap: 6px; padding: 3px 4px; border-radius: 4px;
                white-space: nowrap; }
  .se-wbs-row:hover { background: #1a2230; }
  .se-twisty { width: 12px; color: #5e6b80; cursor: default; user-select: none; }
  .se-wbs-row .se-twisty:hover { color: #9fb0c6; }
  .se-wbs-name { color: #cdd7e4; }
  .se-wbs-name.se-summary { font-weight: 600; color: #eaf1fb; }
  .se-badge { font-size: 10px; color: #76d1a0; background: #16271f; padding: 1px 6px;
              border-radius: 8px; }
  .se-dates { font-size: 10px; color: #6f7d93; margin-left: 6px; }
  /* CPM: critical rail + float */
  .se-wbs-row.se-critical { box-shadow: inset 3px 0 0 #e0556b; }
  .se-float { font-size: 10px; margin-left: 6px; }
  .se-float.crit { color: #e0556b; }
  .se-float.slack { color: #76d1a0; }
  .se-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  #se-cpm-btn { background: #243042; border-color: #34465e; color: #cdd7e4; cursor: pointer; }
  #se-cpm-btn:hover { background: #2c3a50; }
  #se-cpm-out { font-size: 11px; color: #9fb0c6; }
  .se-dep-row.se-dep-crit .se-dep-pred, .se-dep-row.se-dep-crit .se-dep-succ { color: #f0a6b1; font-weight: 600; }
  /* Gantt timeline */
  .gantt-pane { height: calc(58vh - 96px); overflow: auto; padding: 10px 12px; }
  .gantt-pane h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #6f7d93;
                   margin: 0 0 8px; }
  .gantt-pane h2 .hint { text-transform: none; letter-spacing: 0; color: #566177; font-weight: 400; }
  #se-gantt { position: relative; }
  .g-axis { position: relative; height: 16px; margin-left: 152px; border-bottom: 1px solid #2a3342;
            margin-bottom: 4px; }
  .g-tick { position: absolute; top: 0; font-size: 9px; color: #56627a; border-left: 1px solid #222b38;
            height: 16px; padding-left: 3px; }
  .g-row { display: flex; align-items: center; height: 26px; }
  .g-label { width: 150px; min-width: 150px; padding-right: 6px; color: #cdd7e4; white-space: nowrap;
             overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
  .g-track { position: relative; flex: 1; height: 26px; }
  .g-bar { position: absolute; top: 4px; height: 18px; border-radius: 4px; background: #2f6fd1;
           cursor: grab; box-shadow: 0 1px 2px rgba(0,0,0,.4); display: flex; align-items: center;
           color: #eaf1fb; font-size: 10px; padding: 0 6px; white-space: nowrap; overflow: hidden;
           user-select: none; }
  .g-bar.crit { background: #d2475c; }
  .g-bar.dragging { cursor: grabbing; opacity: .85; outline: 1px solid #9fb6d6; }
  .g-handle { position: absolute; right: -5px; top: 6px; width: 12px; height: 14px; cursor: crosshair;
              color: #9fb6d6; font-size: 11px; text-align: center; line-height: 14px; }
  .g-handle:hover { color: #fff; }
  .g-link-mode .g-bar { outline: 1px dashed #4a6fa5; }
  .gantt-empty { color: #6f7d93; font-style: italic; padding: 14px 4px; }
  /* dependency rows */
  .se-dep-row { display: flex; align-items: center; gap: 8px; padding: 5px 4px;
                border-bottom: 1px solid #1c2531; }
  .se-dep-pred { color: #eaf1fb; min-width: 90px; }
  .se-dep-succ { color: #eaf1fb; flex: 1; }
  .se-dep-arrow { color: #5e6b80; }
  select, input, button { background: #1c2430; color: #d8e0ea; border: 1px solid #313c4d;
                          border-radius: 5px; padding: 3px 6px; font: inherit; }
  .se-dep-type { width: 56px; }
  .se-dep-lag { width: 56px; }
  .se-dep-del { color: #e08989; border-color: #3a2730; cursor: pointer; padding: 2px 8px; }
  .se-dep-del:hover { background: #2a1a20; }
  .se-empty { color: #6f7d93; font-style: italic; padding: 8px 4px; }
  /* add-dependency form */
  .se-add { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 14px;
            padding: 10px; background: #141a24; border: 1px solid #232c3a; border-radius: 8px; }
  .se-add label { font-size: 10px; color: #6f7d93; }
  #se-add-btn { background: #1f6feb; border-color: #1f6feb; color: #fff; cursor: pointer;
                font-weight: 600; padding: 4px 12px; }
  #se-add-btn:hover { background: #2a7bf7; }
</style>
</head>
<body>
<header>
  <h1>Schedule Editor</h1>
  <span class="sub">WBS outline + dependencies</span>
  <button id="se-import-btn" title="Import a Primavera P6 programme (.xer or .xml/PMXML) — adopt its WBS, logic and dates onto this model, then bind tasks to elements">⤓ Import P6</button>
  <input id="se-import-file" type="file" accept=".xer,.xml" style="display:none">
  <span id="se-bld">—</span>
</header>
<div id="se-status">Initialising…</div>
<main>
  <section class="pane left">
    <h2>Work Breakdown (WBS)</h2>
    <div id="se-wbs"></div>
  </section>
  <section class="pane right">
    <h2>Dependencies</h2>
    <div class="se-toolbar">
      <button id="se-cpm-btn" title="Critical-path forward/backward pass over the dependency graph">▶ Compute CPM</button>
      <span id="se-cpm-out"></span>
    </div>
    <div id="se-deps"></div>
    <div class="se-add">
      <label>Add link:</label>
      <select id="se-add-pred" title="predecessor"></select>
      <span class="se-dep-arrow">→</span>
      <select id="se-add-succ" title="successor"></select>
      <label>type</label><select id="se-add-type" title="FS/SS/FF/SF"></select>
      <label>lag</label><input id="se-add-lag" type="number" value="0" style="width:54px">
      <button id="se-add-btn">+ Add</button>
    </div>
  </section>
</main>
<section class="gantt-pane">
  <h2>Timeline (Gantt) <span class="hint">— drag a bar to reschedule · drag the ▸ handle onto another bar to link</span></h2>
  <div id="se-gantt"></div>
</section>
<script src="https://cdn.jsdelivr.net/npm/rtree-sql.js@1.7.0/dist/sql-wasm.js"></script>
<script src="rates.js?v=4" onerror="console.warn('§LOAD_FAIL rates.js')"></script>
<script src="schedule_author.js?v=8" onerror="console.warn('§LOAD_FAIL schedule_author.js')"></script>
<script src="foreign_schedule.js?v=1" onerror="console.warn('§LOAD_FAIL foreign_schedule.js')"></script>
<script src="schedule_sync.js?v=2" onerror="console.warn('§LOAD_FAIL schedule_sync.js')"></script>
<script src="schedule_editor_ui.js?v=6" onerror="console.warn('§LOAD_FAIL schedule_editor_ui.js')"></script>
</body>
</html>
