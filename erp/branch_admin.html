<!-- branch_admin.html — the Branch POS Admin (bim-compiler prompts/POS_PLUGIN_LOCAL_FIRST.md §26; uniCenta's Manager / back office, a Team device of the branch Org; Witness: W-EODA-AGG / -GATE / -PARTIAL / -RELAY erp/tests/witness_eoda.js).
     A page of its own, like kitchen.html: the device's own ERP engine (idempiere.html?team=1) runs in a hidden frame. It reads the branch-local POS_TillHandoff rows every till wrote at Close Cash, shows the EODA screen
     (per till: closed/open, ticket range, gaps, Z by tender and tax; the branch total) and makes the ONE send to head office. Query parameters (login=, pipe=, xcfg=, teamplan=) are passed through to the engine. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Branch POS Admin</title>
<style>
  :root { --bg:#101418; --pn:#1b222a; --ln:#33414f; --fg:#eef2f6; --mut:#8fa0b0; --green:#2e9b57; --amber:#d9a21b; --red:#c8402f; --acc:#3b82c4; }
  * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.35 system-ui,sans-serif; }
  .bar { display:flex; gap:8px; align-items:center; padding:6px 10px; background:#17202a; border-bottom:1px solid var(--ln); font-size:13px; flex-wrap:wrap; }
  .chip { padding:1px 9px; border:1px solid var(--ln); border-radius:10px; } input, select { font:inherit; background:#0f151b; color:var(--fg); border:1px solid var(--ln); border-radius:4px; padding:3px 6px; }
  button { font:inherit; padding:8px 12px; border:1px solid var(--ln); border-radius:4px; background:#22303d; color:var(--fg); cursor:pointer; } button.go { background:var(--acc); border-color:var(--acc); } button[disabled] { opacity:.4; cursor:not-allowed; }
  main { padding:10px; } table { border-collapse:collapse; width:100%; background:var(--pn); } th, td { border:1px solid var(--ln); padding:5px 8px; text-align:left; vertical-align:top; font-size:13px; } th { background:#22303d; }
  tr[data-closed="1"] td.st { color:#7be39c; } tr[data-closed="0"] td.st { color:#ffd166; } .gap { color:#ffb3a8; } tfoot td { font-weight:700; }
  #a-engine { position:absolute; left:-10000px; top:0; width:1100px; height:800px; border:0; } #a-msg[hidden] { display:none; }
</style></head><body>
<div class="bar"><b>Branch POS Admin</b><span id="a-net" class="chip">online</span><span id="a-pair" class="chip">starting</span><span id="a-org" class="chip"></span>
  <label>Business day <select id="a-day"></select></label><label>Tills <input id="a-tills" size="22" placeholder="expected till keys, comma separated"></label>
  <button id="a-refresh">Refresh</button><span id="a-msg" class="chip" hidden></span></div>
<main><table id="a-table"><thead><tr><th>Till</th><th>State</th><th>Tickets</th><th>Series (first..last, count)</th><th>Gaps</th><th>Z by tender</th><th>Z by tax</th><th>Gross</th></tr></thead><tbody id="a-rows"></tbody>
  <tfoot><tr id="a-total"><td>Branch total</td><td id="t-state"></td><td id="t-tickets"></td><td></td><td></td><td id="t-tender"></td><td id="t-tax"></td><td id="t-gross"></td></tr></tfoot></table>
  <p><label>Override reason (needed to send while a till is open) <input id="a-override" size="40"></label>
  <button id="a-send" class="go" disabled>Send EODA</button> <button id="a-status">Send status now</button> <span id="a-sendnote" class="chip"></span></p>
  <p id="a-soda"><b>SODA</b> <span id="s-state" class="chip">no batch</span> <button id="a-soda-fan" disabled>Pass prices to tills</button> <button id="a-soda-recv" disabled>Receive stock</button> <span id="s-recv" class="chip"></span></p></main>
<iframe id="a-engine" title="engine" aria-hidden="true"></iframe>
<script src="eoda_core.js"></script><script src="soda_core.js"></script><script src="kds_link.js"></script><script src="branch_admin.js"></script>
</body></html>
