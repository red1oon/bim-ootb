<style>

  #strip{position:fixed;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:5}

    color:#9fb4cc;border:1px solid #243750}
  .pill.fm{background:#13345a;color:#cfe3ff;border-color:#2f6fb0;box-shadow:0 0 0 3px #2f6fb033}
  .cap{position:fixed;right:64px;top:calc(50% - 86px);font-size:12px;color:#9fb4cc;opacity:.8}

<body>

       panes' chart-creation code is guarded `if (G.Chart)` so it silently no-op'd without this tag). -->

  <script src="../../viewer/hba_dashboard.js"></script>
  <script src="../../viewer/hba_payslip.js"></script>

  <script src="../../viewer/hba_iot.js"></script>
  <script src="../../viewer/hba_lens.js"></script>
  <script>
    // mock APP: real lease-room guids (Occupancy/Presence/Tenancy/Class detect) + a real asset guid (Assets/IoT
    // detects too, per §P10b) + seeded signed logs. Dashboard detects (browser DOM present).
    var rooms = [ { guid:'RM_Level_1_1', name:'≈ Level 1 R1', storey:'Level 1' }, { guid:'RM_Level_1_3', name:'≈ Level 1 R3', storey:'Level 1' }, { guid:'RM_Level_1_4', name:'≈ Level 1 R4', storey:'Level 1' } ];
    var assetGuid = self.HbaModels.records('Asset')[0].bim_guid;
    var guidMap = {}; rooms.forEach(function(r,i){ guidMap[String(7000+i)] = r.guid; }); guidMap['8000'] = assetGuid;
    var A = { guidMap: guidMap, _hbaRooms: rooms, _hbaStoreyOf: {}, _hbaRoomMembers: {}, _hbaPeriod: '2026-07', status:{textContent:''},
      markDirty: function(){}, collectMeshes: function(pred){
        var ms = rooms.map(function(r,i){ return { isMesh:true, userData:{guid:r.guid}, position:{x:i*4,y:0,z:0} }; })
          .concat([{ isMesh:true, userData:{guid:assetGuid}, position:{x:12,y:0,z:0} }]);
        return pred ? ms.filter(pred) : ms;
      } };
    rooms.forEach(function(r){ A._hbaStoreyOf[r.guid]=r.storey; A._hbaRoomMembers[r.guid]=[r.guid]; });
    A._hbaOccupancyLog = self.HbaOccupancy.demoSeed(rooms).log;
    A._hbaAttendanceLog = self.HbaAttendance.demoSeed(rooms, '2026-07').log;
    A._hbaPayrollSpec = self.HbaAdPayroll.demoSpec();   // P7 — payroll has no spatial binding to check, seeded like the others
    var payEmps = A._hbaPayrollSpec.employees.map(function(e){ return { id: e.name, name: e.name }; });
    var leaveLogs = {}; payEmps.forEach(function(e){ leaveLogs[e.id] = self.HbaLeave.demoLog(e.id); });
    A._hbaLeaveSpec = { period: null, policy: null, locale: 'en', employees: payEmps, log: leaveLogs };   // P8 — same reasoning
    A._hbaTenancySpec = self.HbaAdTenancy.compileBuilding('HHS_Office_Federated', rooms, self.HbaModels.records('Tenancy'), self.HbaModels.records('Strata'));   // §P10-BUILD/§P10a
    window.APP = A;
    // open the REAL family drawer (the same call panels.js makes)
    var d = self.HBALens.openFamilyDrawer(A);
    var avail = self.HBALens.availableLenses(A);
    console.log('§FM_DEMO drawer rendered=' + !!d + ' available=' + avail.filter(function(x){return x.available;}).map(function(x){return x.id;}).join(','));
    document.title = 'Human-Asset ready · ' + avail.filter(function(x){return x.available;}).length + '/8 lenses';
  </script>
