name: BIM tools (bim.html / bim-cli)
# Spec: bim-compiler prompts/BIM_UTILITY_KNIFE.md §"Windows must work". Proves the engine + generated launcher on all three OS.
on:
  push:
    paths: ['bim/**', 'bim.html', 'bim-cli.js', '.github/workflows/bim-tools.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: IfcOpenShell (independent validity oracle; INCONCLUSIVE, never PASS, if it cannot install)
        run: pip install ifcopenshell
        continue-on-error: true
      - name: Engine witnesses (W-UP, W-EX, W-SPLIT, W-CLI-1a)
        env:
          PUPPETEER_PAGE: '0'
        run: node bim/tests/witness_bim_engine.js IFC/Duplex_ARC.ifc IFC/SampleHouse_ARC.ifc
      - name: Launcher stub from a path with spaces (W-WIN-2)
        run: node bim/tests/witness_bim_launcher.js IFC/Duplex_ARC.ifc IFC/SampleHouse_ARC.ifc
      - name: Kit installer from an unzipped kit (W-INST; Windows runs INSTALL.bat with PowerShell shortcuts)
        run: node bim/tests/witness_bim_install.js IFC/Duplex_ARC.ifc
      - name: Toolkit zip builds and is a valid zip (W-KIT; the Windows .bat flavour on windows-latest)
        shell: bash
        run: |
          node bim-cli.js kit --os ${{ matrix.os == 'windows-latest' && 'win' || (matrix.os == 'macos-latest' && 'mac' || 'sh') }} -o "$RUNNER_TEMP/kit.zip"
          python -c "import zipfile,sys;z=zipfile.ZipFile(sys.argv[1]);assert z.testzip() is None;print('§WITNESS PASS W-KIT-2 entries',len(z.infolist()))" "$RUNNER_TEMP/kit.zip"
  page:
    # The page itself (bim.html) in a headless Chromium on each OS: render, hover tip, search, export, reload-restore, drag-out payload.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install puppeteer outside the repo
        shell: bash
        run: npm install puppeteer --prefix "$RUNNER_TEMP/pp" --no-audit --no-fund
      - name: Page witnesses (W-RUN-2, W-PICK-1..5, W-RELOAD, W-DRAG-1)
        shell: bash
        env:
          BIM_NO_OPEN: '1'
        run: |
          export PUPPETEER="$RUNNER_TEMP/pp/node_modules/puppeteer"
          node bim/tests/witness_bim_page.js IFC/Duplex_ARC.ifc
          node bim/tests/witness_bim_reload.js IFC/Duplex_ARC.ifc
          node bim/tests/witness_bim_search.js IFC/Duplex_ARC.ifc
          node bim/tests/witness_bim_restore.js IFC/Duplex_ARC.ifc
          node bim/tests/witness_bim_camera.js - IFC/Duplex_ARC.ifc IFC/SampleHouse_ARC.ifc
          node bim/tests/witness_bim_persist.js IFC/Duplex_ARC.ifc
          node bim/tests/witness_bim_focus.js IFC/Duplex_ARC.ifc
          node bim/tests/witness_bim_dragout.js
