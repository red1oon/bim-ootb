name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need tags so we can resolve the latest semver release for the Release row
      # Stamp the provenance the System Monitor Release row reads (prompts/RESUME_SYSMON_RELEASE_LINK.md §FIX A.2).
      # version = the latest SEMVER release (vX.Y.Z, cut by release-please — the curated "what's new" the row links).
      # build   = this deploy's sw CACHE_VERSION (vNNN — the precise bits on THIS device, cache-bust id).
      # Generated into the artifact only (never committed); NOT precached, so it's always the freshly-deployed value.
      - name: Stamp erp/version.json (Release-row provenance)
        run: |
          BUILD=$(grep -oE "CACHE_VERSION = '[^']+'" erp/sw.js | head -1 | sed "s/.*'\([^']*\)'.*/\1/")
          REL=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          VERSION="${REL:-$BUILD}"                                   # fall back to the build if no semver release yet
          SHA=$(git rev-parse --short HEAD)
          PR=$(git log -1 --pretty=%s | grep -oE '\(#[0-9]+\)' | tr -d '(#)' || true)
          DATE=$(date -u +%Y-%m-%d)
          printf '{"version":"%s","build":"%s","sha":"%s","pr":%s,"date":"%s"}\n' "$VERSION" "$BUILD" "$SHA" "${PR:-null}" "$DATE" > erp/version.json
          echo "§SYSMON-RELEASE stamped erp/version.json: $(cat erp/version.json)"
      # Rebuild the two SHIPPED AGENT BUNDLES (prompts/AGENT_QUEUE.md §AGENT-ZIPS-BUILT / §PZ.3).
      # ⚠ THIS STEP DOES NOT REACH USERS TODAY, and neither does the version.json stamp above or the
      # minify below: Pages for this repo is build_type "legacy", source {branch: main, path: /}, so it
      # serves the TRACKED FILES ON MAIN and the artifact this job uploads is published by nothing
      # (measured — erp/version.json has been 404 live since it was introduced, and the live JS is
      # byte-identical to source, unminified). The zips are therefore COMMITTED; this step is kept so the
      # artifact is correct the day Pages is switched to build_type "workflow", and it is harmless now.
      - name: Build the shipped agent zips from their source directories
        run: node erp/tools/build_agent_zips.js

      # Minify OUR OWN JS in the ephemeral checkout only (prompts/UI_PAYLOAD_PERF.md Win #1).
      # The repo source in git is NEVER changed — readable-source ethos preserved; only the
      # uploaded Pages artifact is minified. Whitespace+syntax only (no identifier mangling),
      # so cross-file window.* globals stay intact. Measured: gz ~1167KB → ~737KB (−36.9%).
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Minify own JS into the Pages artifact
        run: |
          npm i --no-save esbuild@0.23.0
          node scripts/minify_pages.js .
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
