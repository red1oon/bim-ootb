name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need tags so we can resolve the latest semver release for the Release row
      # Stamp the provenance the System Monitor Release row reads (prompts/RESUME_SYSMON_RELEASE_LINK.md §FIX A.2).
      # version = the latest SEMVER release (vX.Y.Z, cut by release-please — the curated "what's new" the row links).
      # build   = this deploy's sw CACHE_VERSION (vNNN — the precise bits on THIS device, cache-bust id).
      # Generated into the artifact only (never committed); NOT precached, so it's always the freshly-deployed value.
      - name: Stamp erp/version.json (Release-row provenance)
        run: |
          BUILD=$(grep -oE "CACHE_VERSION = '[^']+'" erp/sw.js | head -1 | sed "s/.*'\([^']*\)'.*/\1/")
          REL=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          VERSION="${REL:-$BUILD}"                                   # fall back to the build if no semver release yet
          SHA=$(git rev-parse --short HEAD)
          PR=$(git log -1 --pretty=%s | grep -oE '\(#[0-9]+\)' | tail -n 1 | tr -d '(#)' || true)   # the LAST number = the PR: a subject with an issue and a PR number gave two lines here and broke the JSON
          DATE=$(date -u +%Y-%m-%d)
          printf '{"version":"%s","build":"%s","sha":"%s","pr":%s,"date":"%s"}\n' "$VERSION" "$BUILD" "$SHA" "${PR:-null}" "$DATE" > erp/version.json
          echo "§SYSMON-RELEASE stamped erp/version.json: $(cat erp/version.json)"
      # Rebuild the two SHIPPED AGENT BUNDLES (prompts/AGENT_QUEUE.md §AGENT-ZIPS-BUILT / §PZ.3).
      # ⚠ TWO PUBLISHERS, LAST ONE WINS (measured 2026-11-13 and 2026-11-14; the older note here said this artifact
      # reaches nobody: that was no longer true). While Pages for this repo is build_type "legacy"
      # (source: branch main), GitHub's own "pages build and deployment" ALSO publishes the tracked files on
      # every push. Whichever of the two finishes last is what users get:
      #   - this workflow last  → minified JS, erp/version.json present, the zips built here
      #   - the branch build last → raw tracked files, erp/version.json 404
      # A merge made with the workflow token (ci.yml's auto-merge) starts ONLY the branch build.
      # The zips are therefore still COMMITTED, so both publishers serve them.
      # The fix is a repository setting, not code: Settings ▸ Pages ▸ Source = "GitHub Actions"
      # (build_type "workflow"), which makes this workflow the only publisher.
      # Check after any merge: X0 Navigator ▸ Run & Ship ▸ Fetch back must say PASS
      # (bim-compiler prompts/CODE_ARCHITECTURE_DESIGN.md §F.13).
      - name: Build the shipped agent zips from their source directories
        run: node erp/tools/build_agent_zips.js

      # Minify OUR OWN JS in the ephemeral checkout only (prompts/UI_PAYLOAD_PERF.md Win #1).
      # The repo source in git is NEVER changed — readable-source ethos preserved; only the
      # uploaded Pages artifact is minified. Whitespace+syntax only (no identifier mangling),
      # so cross-file window.* globals stay intact. Measured: gz ~1167KB → ~737KB (−36.9%).
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Minify own JS into the Pages artifact
        run: |
          npm i --no-save esbuild@0.23.0
          node scripts/minify_pages.js .
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
