name: CI
on: push

permissions:
  contents: write
  pull-requests: write

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install lint deps
        run: npm ci

      - name: JS syntax check
        run: find viewer modeller -name '*.js' ! -path '*/lib/*' -exec node --check {} +

      - name: Undefined-reference gate (no-undef)
        run: npx eslint viewer modeller

      - name: Import worker safety
        run: node tests/test_import_worker_safety.js

      - name: SW precache audit
        run: node tests/audit_sw_precache.js

      - name: Script tag audit
        run: node tests/audit_script_tags.js

      - name: Split-DB wiring
        run: node tests/test_s274_split_db_wiring.js

      - name: Input registry audit
        run: node tests/audit_input_registry.js

      - name: Spec file paths audit
        run: node tests/audit_spec_paths.js

      # W-AGENT-ZIP-SYNC (prompts/AGENT_QUEUE.md §AGENT-ZIPS-BUILT): the two shipped agent downloads are
      # BUILT from erp/*_agent/, not tracked. This proves the builder still produces both bundles, that a
      # user extracts the repo's own files, that each keeps its shipped shape, and that the build is
      # deterministic. It caught the defect that motivated it: odoo_agent.zip shipped without
      # extract_model.js, the file the Odoo extraction step needs.
      - name: Shipped agent zips build from source (W-AGENT-ZIP-SYNC)
        run: node erp/tests/poc_agent_zip_sync.js

      - name: Find multi-select logic (NAV_FIND_002)
        run: node tests/test_find_multiselect.js

      - name: Sunglass recolor guard (S280f — colorless-material crash)
        run: node tests/test_recolor_guard.js

      - name: Ground texture engine (S280g)
        run: node tests/test_ground_texture.js

      # W-X0-CI (bim-compiler prompts/CODE_ARCHITECTURE_DESIGN.md §F.24, #3089): the node-only X0 Navigator witnesses
      # that run in seconds. Exit 0 alone is not a pass (a witness can exit 0 with INCONCLUSIVE): each must also print verdict=PASS.
      # deploy_cost and context are left out: they parse with the TypeScript inside VS Code (scripts/lib/find_ts.js, no npm install),
      # which a runner does not have, so here they report INCONCLUSIVE (measured on this PR's first run). Run them locally.
      - name: X0 Navigator witnesses (node only)
        run: |
          set -u; failed=""; mkdir -p logs
          for w in isolation lens appdef core_pure; do
            f=devtools/vscode/x0-navigator/tests/witness_x0_$w.js; log=logs/ci_x0_$w.log
            rc=0; node "$f" < /dev/null > "$log" 2>&1 || rc=$?
            v=$(grep -E 'verdict=[A-Z]+' "$log" | tail -1 || true)
            echo "§X0_CI $w exit=$rc :: $v"
            if [ "$rc" -ne 0 ] || ! printf '%s' "$v" | grep -q 'verdict=PASS'; then failed="$failed $w"; tail -20 "$log"; fi
          done
          if [ -n "$failed" ]; then echo "§X0_CI verdict=FAIL failed=${failed# }"; exit 1; fi
          echo "§X0_CI checked=4 verdict=PASS"

      # W-CORE-PURE (bim-compiler prompts/CODE_ARCHITECTURE_DESIGN.md Part A, A3; #3180): no core file (ERP processes, callouts,
      # models, posting, the 4D schedule maths) calls a clock, random numbers or the network itself; it asks the installed edge.
      # A parser scan over the core list by pathspec, with its own red control. Exit 0 alone is not a pass: it must print verdict=PASS.
      - name: Core files stay pure (W-CORE-PURE)
        run: |
          set -u; mkdir -p logs; rc=0
          node erp/tests/witness_core_pure.js < /dev/null > logs/ci_core_pure.log 2>&1 || rc=$?
          grep -E '§CORE_PURE_HIT|§CORE_PURE_RED|§CORE_PURE_PARSE_FAIL|FAIL ' logs/ci_core_pure.log || true
          v=$(grep -E '^§CORE_PURE files=' logs/ci_core_pure.log | tail -1 || true)
          echo "$v"
          if [ "$rc" -ne 0 ] || ! printf '%s' "$v" | grep -q 'verdict=PASS'; then exit 1; fi

      # W-MANIFEST-ROUNDTRIP (bim-compiler prompts/CODE_ARCHITECTURE_DESIGN.md Part B, B0; #3195): one manifest per app (viewer, erp, modeller)
      # is built from the pages, lazy lists and service workers, and every one of those files must regenerate from it byte-identical.
      # A hand edit in a spelling the generator cannot write (a script tag with an extra attribute, a non-literal precache entry) fails here,
      # with the file, the line and the canonical form. Check only: nothing is written. --skip-c7 leaves out the 1-minute bump.js dry run; --skip-c9
      # the git-history claim (a shallow checkout has no parent). B1 (#3244): the modeller is written from modeller/modules.json — a hand edit of
      # a generated tag / precache entry fails here; edit modules.json, then run node scripts/gen_manifest.js --write modeller.
      - name: Module lists rebuild from one manifest per app (W-MANIFEST-ROUNDTRIP)
        run: |
          set -u; mkdir -p logs; rc=0
          node scripts/tests/witness_manifest_roundtrip.js --skip-c7 --skip-c9 < /dev/null > logs/ci_manifest_roundtrip.log 2>&1 || rc=$?
          grep -E '§MANIFEST_(FAIL|NONCANONICAL|CLAIM|RED|INCONCLUSIVE|C[0-9]+_MISS)|§DEPS_(UNREVIEWED|REVIEW_STALE|HAND)|FAIL ' logs/ci_manifest_roundtrip.log || true
          v=$(grep -E '^§MANIFEST_ROUNDTRIP ' logs/ci_manifest_roundtrip.log | tail -1 || true)
          echo "$v"
          if [ "$rc" -ne 0 ] || ! printf '%s' "$v" | grep -q 'verdict=PASS'; then exit 1; fi

      # W-DEPS-CAND (bim-compiler prompts/CODE_ARCHITECTURE_DESIGN.md Part B, B1 §3; #3244): the dependency-candidate tool classifies
      # every read (load / call, guarded or not) the same way RUNNING the fixture scripts in both orders does, and every file:line it
      # cites on the modeller really holds the name. Dev-side; writes nothing. Exit 0 alone is not a pass: it must print verdict=PASS.
      # W-PROOF-MAP (bim-compiler prompts/CODE_ARCHITECTURE_DESIGN.md Part E, E1): which witness proves which modeller module (PROVES: lines, owner E-1);
      # a PROVES: line naming a missing file fails here; a cached INCONCLUSIVE is never shown as a pass; a run older than its witness is stale.
      - name: Proof map stays honest (W-PROOF-MAP)
        run: |
          set -u; mkdir -p logs; rc=0
          node scripts/tests/witness_proof_map.js < /dev/null > logs/ci_proof_map.log 2>&1 || rc=$?
          grep -E 'ok=N|§PROOF_MAP_BAD' logs/ci_proof_map.log || true
          v=$(grep -E '^§PROOF_MAP_W ' logs/ci_proof_map.log | tail -1 || true)
          echo "$v"
          if [ "$rc" -ne 0 ] || ! printf '%s' "$v" | grep -q 'verdict=PASS'; then exit 1; fi

      # CI FAST TIER (bim-compiler prompts/CODE_ARCHITECTURE_DESIGN.md Part E, CI-TIER; owner "Fast tier on every PR"): every headless witness that
      # passed locally in < 10 s with no outside input (tests/ci_fast_tier.json, written by scripts/gen_ci_tier.js from the last local runs; probed
      # without outside inputs). A red here = a witness that used to pass. Budget 10 min; a witness not reached is named. Plus W-CI-TIER itself.
      - name: Fast witness tier (CI-TIER)
        run: |
          set -u; mkdir -p logs; rc=0
          node scripts/tests/witness_ci_tier.js < /dev/null > logs/ci_tier_w.log 2>&1 || rc=$?
          tail -1 logs/ci_tier_w.log
          node scripts/run_ci_tier.js --budget-s 600 --timeout-s 60 < /dev/null > logs/ci_tier.log 2>&1 || rc=$?
          grep -E 'ok=N' logs/ci_tier.log || true
          v=$(grep -E '^§CI_TIER_RESULT ' logs/ci_tier.log | tail -1 || true)
          echo "$v"
          if [ "$rc" -ne 0 ] || ! printf '%s' "$v" | grep -q 'verdict=PASS'; then exit 1; fi

      # W-4D-EDITOR-CI (bim-compiler prompts/4D_MODEL_INTEGRITY.md §Q.21.3, §Q.22.4): the four Gantt-editor witnesses on the PLAYED
      # layer of the one building db the repo tracks as a real file (HHS_Office_Federated_extracted.db, 75 MB, no LFS). Before this,
      # no CI step ran any 4D gate, so another lane could break the editor unseen. Needs nothing outside the checkout (measured with an
      # empty HOME: 36-92 s each). Exit 0 alone is not a pass: each must print its summary with fail=0 inconclusive=0.
      - name: 4D Gantt editor witnesses on the played layer (W-4D-EDITOR-CI)
        run: |
          set -u; failed=""; mkdir -p logs
          for p in "one_commit_pipeline OCP W_OCP" "undo_every_edit UE W_UE" "reorder RO W_RO" "shift_links GL W_GL"; do
            set -- $p; log=logs/ci_4d_$1.log; rc=0
            (cd viewer && env BLD_DIR="$GITHUB_WORKSPACE/buildings" "$2_BLD=HHS_Office_Federated" timeout 600 node "tests/witness_gantt_$1.js" < /dev/null) > "$log" 2>&1 || rc=$?
            v=$(grep -aoE "§$3_SUMMARY.*" "$log" | tail -1 || true)
            echo "§4D_EDITOR_CI $1 exit=$rc :: $v"
            if [ "$rc" -ne 0 ] || ! printf '%s' "$v" | grep -qE 'fail=0 inconclusive=0'; then failed="$failed $1"; tail -20 "$log"; fi
          done
          if [ -n "$failed" ]; then echo "§4D_EDITOR_CI verdict=FAIL failed=${failed# }"; exit 1; fi
          echo "§4D_EDITOR_CI checked=4 verdict=PASS"

      - name: Dependency candidates agree with a real run (W-DEPS-CAND)
        run: |
          set -u; mkdir -p logs; rc=0
          node scripts/tests/witness_deps_candidates.js < /dev/null > logs/ci_deps_candidates.log 2>&1 || rc=$?
          grep -E 'ok=N|§DEPS_W_(FAIL|INCONCLUSIVE|CITE_MISS|RED)' logs/ci_deps_candidates.log || true
          v=$(grep -E '^§DEPS_W ' logs/ci_deps_candidates.log | tail -1 || true)
          echo "$v"
          if [ "$rc" -ne 0 ] || ! printf '%s' "$v" | grep -q 'verdict=PASS'; then exit 1; fi

  e2e-tests:
    # pinned: ubuntu-latest is rolling to 26.04, where `playwright install chromium` fails
    # ("Playwright does not support chromium on ubuntu26.04-x64", bim-ootb #3220 run 44147388376)
    runs-on: ubuntu-24.04
    needs: fast-checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        working-directory: tests
        run: npm ci && npx playwright install chromium

      - name: Download test data
        working-directory: tests
        run: ./setup-test-data.sh

      - name: DB integrity audit
        working-directory: tests
        run: node audit_db_integrity.js

      - name: Golden path — IFC drop → viewer (ensures import works)
        working-directory: tests
        run: npx playwright test --project=desktop s274-golden-path

      - name: Auto-merge PR when all checks pass
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "${{ github.ref_name }}" || true
