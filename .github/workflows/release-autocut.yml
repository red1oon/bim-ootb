# Auto-cut a GitHub Release on every CACHE_VERSION bump that lands on main.
# prompts/RESUME_SYSMON_RELEASE_LINK.md §FIX B (decision LOCKED 2026-06-25: "make it auto ie cut real GH releases").
# The System Monitor Release row links to …/releases/tag/vNNN — this is what makes that link a real page, not a 404.
# A new vNNN is impossible to ship without its release: the bump and the release land from the same push.
# Idempotent: if the tag/release already exists, it skips. The release NOTES are the merge commit message
# (subject + body) so the page literally shows "what was last done".
name: Auto-cut Release on version bump

on:
  push:
    branches: [main]

permissions:
  contents: write   # create tags + releases

concurrency:
  group: release-autocut
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags so existence check + notes work
      - name: Cut the release for the current sw CACHE_VERSION (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER=$(grep -oE "CACHE_VERSION = '[^']+'" erp/sw.js | head -1 | sed "s/.*'\([^']*\)'.*/\1/")
          if [ -z "$VER" ]; then echo "no CACHE_VERSION in erp/sw.js — nothing to cut"; exit 0; fi
          if git rev-parse -q --verify "refs/tags/$VER" >/dev/null 2>&1 || gh release view "$VER" >/dev/null 2>&1; then
            echo "release/tag $VER already exists — skip (idempotent)"; exit 0
          fi
          SUBJECT=$(git log -1 --pretty=%s)
          BODY=$(git log -1 --pretty=%b)
          NOTES=$(printf '%s\n\n%s\n\n— auto-cut at deploy from %s' "$SUBJECT" "$BODY" "$(git rev-parse --short HEAD)")
          gh release create "$VER" --target "${{ github.sha }}" --title "$VER" --notes "$NOTES"
          echo "§SYSMON-RELEASE-LINK href=https://github.com/${{ github.repository }}/releases/tag/$VER kind=release autocut=Y"
