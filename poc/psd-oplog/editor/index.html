<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OpLog Paint</title><link rel="icon" href="data:,">
<style>
:root { --bg:#14161a; --panel:#1d2026; --line:#2c313a; --fg:#e6e8ec; --mut:#9097a3; --acc:#4c8dff; color-scheme: dark; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg:#eef0f3; --panel:#fff; --line:#d5d9e0; --fg:#1b1f24; --mut:#5d6674; --acc:#2563eb; color-scheme: light; } }
* { box-sizing: border-box; } body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; display:grid; grid-template-columns: 76px 1fr 260px; grid-template-rows: auto 1fr; height:100vh; }
header { grid-column:1/4; display:flex; flex-wrap:wrap; gap:14px; align-items:center; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); }
header label { display:flex; gap:6px; align-items:center; color:var(--mut); } input[type=range] { width:110px; }
button, select { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:inherit; cursor:pointer; } button:disabled { opacity:.4; cursor:default; } button.on { border-color:var(--acc); outline:1px solid var(--acc); }
#tools { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; gap:6px; padding:8px; } #tools button { padding:8px 2px; font-size:12px; }
main { display:grid; place-items:center; overflow:auto; padding:12px; } canvas { width:min(100%, calc(100vh - 100px)); aspect-ratio:1; background:#fff; touch-action:none; cursor:crosshair; box-shadow:0 2px 14px #0006; }
aside { background:var(--panel); border-left:1px solid var(--line); padding:10px; overflow:auto; } aside h3 { margin:4px 0 8px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); }
.layer { border:1px solid var(--line); border-radius:8px; padding:8px; margin-bottom:8px; } .layer.on { border-color:var(--acc); } .layer div { display:flex; gap:6px; align-items:center; margin-top:6px; } .layer b { flex:1; cursor:pointer; } .layer input[type=range], .layer select { flex:1; min-width:0; width:0; }
#info { color:var(--mut); font-size:12px; margin-left:auto; }
@media (max-width:760px) { body { grid-template-columns:1fr; grid-template-rows:auto auto 1fr auto; height:auto; } header { grid-column:1; } #tools { flex-direction:row; border-right:0; border-bottom:1px solid var(--line); } aside { border-left:0; border-top:1px solid var(--line); } }
</style></head><body>
<header>
  <button id="undo" disabled>Undo</button><button id="redo" disabled>Redo</button>
  <label>Colour <input id="color" type="color" value="#1a3399"></label>
  <label>Size <input id="size" type="range" min="2" max="120" value="14"><span id="sizev">14</span></label>
  <label>Flow <input id="flow" type="range" min="5" max="100" value="100"><span id="flowv">100</span></label>
  <label>Smudge <input id="strength" type="range" min="5" max="100" value="70"><span id="strv">70</span></label>
  <button id="save">Save log</button><button id="loadb">Load log</button><input id="loadf" type="file" accept=".json,.oplog" hidden>
  <span id="info"></span>
</header>
<nav id="tools"><button data-tool="hard" class="on" title="Hard brush">Hard</button><button data-tool="soft" title="Soft brush">Soft</button><button data-tool="smudge" title="Smudge">Smudge</button><button data-tool="erase" title="Eraser (uses Size and Flow)">Erase</button><button data-tool="blur" title="Click to blur a 128x128 area">Blur</button></nav>
<main><canvas id="c"></canvas></main>
<aside><h3>Layers</h3><div id="layers"></div><button id="addl">Add layer</button><p style="color:var(--mut);font-size:12px">Every action is one entry in an op log. Undo/redo, save and replay all come from that log.</p></aside>
<script src="../stack.js"></script><script src="../filters/blur.js"></script><script src="../filters/brush.js"></script><script src="../perf/dirty.js"></script><script src="editor.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id), canvas = $('c'), ed = Editor.createEditor(canvas, 1024); window.__ed = ed;
  const xy = (e) => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) * ed.W / r.width, (e.clientY - r.top) * ed.W / r.height]; };
  canvas.addEventListener('pointerdown', (e) => { canvas.setPointerCapture(e.pointerId); const [x, y] = xy(e); ed.begin(x, y); });
  canvas.addEventListener('pointermove', (e) => { const [x, y] = xy(e); ed.move(x, y); });
  for (const t of ['pointerup', 'pointercancel']) canvas.addEventListener(t, () => ed.end());
  for (const b of document.querySelectorAll('#tools button')) b.onclick = () => { ed.params.tool = b.dataset.tool; document.querySelectorAll('#tools button').forEach((x) => x.classList.toggle('on', x === b)); };
  $('color').oninput = (e) => { const h = e.target.value; ed.params.color = [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255); }; $('color').oninput({ target: $('color') });
  $('size').oninput = (e) => { ed.params.size = +e.target.value; $('sizev').textContent = e.target.value; }; $('flow').oninput = (e) => { ed.params.flow = e.target.value / 100; $('flowv').textContent = e.target.value; }; $('strength').oninput = (e) => { ed.params.strength = e.target.value / 100; $('strv').textContent = e.target.value; };
  $('undo').onclick = () => ed.undo(); $('redo').onclick = () => ed.redo(); $('addl').onclick = () => ed.addLayer();
  $('save').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ed.save()], { type: 'application/json' })); a.download = 'painting.oplog.json'; a.click(); };
  $('loadb').onclick = () => $('loadf').click(); $('loadf').onchange = async (e) => { const f = e.target.files[0]; if (f) { try { ed.load(await f.text()); } catch (err) { alert(err.message); } } };
  addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? ed.redo() : ed.undo(); } });
  function ui() {
    $('undo').disabled = !ed.canUndo(); $('redo').disabled = !ed.canRedo(); $('info').textContent = ed.ops.length + ' ops in the log';
    const box = $('layers'); box.textContent = '';
    for (const l of ed.layers().slice().reverse()) { const d = document.createElement('div'); d.className = 'layer' + (l.id === ed.params.layer ? ' on' : ''); const name = l.id === 0 ? 'Background' : 'Layer ' + l.id;
      d.innerHTML = '<div><b>' + name + '</b></div>'; d.firstChild.firstChild.onclick = () => { ed.params.layer = l.id; ui(); };
      if (l.id !== 0) { const row = document.createElement('div'), op = document.createElement('input'), md = document.createElement('select'); op.type = 'range'; op.min = 0; op.max = 100; op.value = Math.round(l.opacity * 100); op.onchange = () => ed.setLayer(l.id, 'opacity', op.value / 100);
        for (const m of ['normal', 'multiply', 'screen', 'overlay', 'soft-light', 'hard-light', 'darken', 'lighten', 'difference', 'exclusion']) { const o = document.createElement('option'); o.value = o.textContent = m; if (m === l.mode) o.selected = true; md.appendChild(o); } md.onchange = () => ed.setLayer(l.id, 'mode', md.value); row.append(op, md); d.appendChild(row); }
      box.appendChild(d); }
  }
  ed.onChange(ui); ui();
})();
</script></body></html>
