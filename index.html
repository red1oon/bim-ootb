<!--
  THE MATRIX LANDING — this IS index.html, the live front door (the old gallery is preserved as gallery.html).
  REUSES real components: erp/icons.js (ICONS), erp/pill_builder.js (PillBuilder ⋯ rail), common/whole_history.js,
  common/about_diy.js (shared About), viewer/locale_loader.js (flag picker).
  ENTRANCE: first-timer / cleared cache → red pill → round01.jpg vortex → the launcher icons drop into the hole.
  RESTING (user's choice, 2026-06-19): a REFRESH summons the big round selection; RETURNING (Home / back) shows
  the compact ⋯ rail. A pick docks its icon to the ⋯ corner, then opens the surface. Glyphs = standard Lucide set.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root { --gold:#e8a735; --blue:#0277bd; --red:#e23b4e; --glow:#5ffacb; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#000; color:#e0e0e0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; overflow:hidden; }
  .screen { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    flex-direction:column; text-align:center; }
  .screen.active { display:flex; }

  /* ---- intertitle font: old-English silent-movie cards (red/blue messages + blue exit quote) ---- */
  .intertitle { font-family:'IM Fell English','Pirata One',Georgia,serif; font-style:italic; }

  /* ---- Morpheus gate — the jpg IS the interface; hover = message, halves = choice ---- */
  #morpheus { background:#000; }
  .morph-wrap { position:relative; display:inline-block; line-height:0; }
  #morph-img { width:min(68vw,680px); max-height:64vh; object-fit:contain;
    filter:brightness(0.92) drop-shadow(0 0 0 transparent); transition:filter .9s ease; user-select:none; }
  #morph-img.loading { animation:glow 1.2s ease-in-out infinite; }
  @keyframes glow {
    0%,100% { filter:brightness(0.7) drop-shadow(0 0 6px rgba(232,167,53,.25)); }
    50%     { filter:brightness(1.15) drop-shadow(0 0 26px rgba(232,167,53,.7)); } }
  @media (prefers-reduced-motion: reduce) { #morph-img.loading { animation:none; filter:brightness(1.1); } }
  .hot { position:absolute; top:0; bottom:0; width:50%; cursor:pointer; }
  .hot.red  { left:0; }
  .hot.blue { right:0; }
  .hot:hover { background:radial-gradient(circle at center,rgba(255,255,255,.06),transparent 70%); }
  .hot[data-tip]:hover::after { content:attr(data-tip); position:absolute; left:50%; bottom:12%;
    transform:translateX(-50%); white-space:nowrap; background:rgba(0,0,0,.8); color:#ece3cf;
    border:1px solid rgba(255,255,255,.16); padding:10px 18px; border-radius:8px;
    font-family:'IM Fell English','Pirata One',Georgia,serif; font-style:italic; font-size:21px;
    line-height:1; pointer-events:none; letter-spacing:.4px; }

  /* ---- graceful blue end ---- */
  #ended { background:#000; }
  #ended .quote { font-size:30px; color:#b9ac8e; max-width:620px; line-height:1.55; padding:0 24px; }
  #ended .back { margin-top:34px; color:#0277bd; cursor:pointer; font-size:14px; text-decoration:underline; }

  /* ============ THE MATRIX PORTAL — round01 vortex fills the screen; the vortex IS the loader ============ */
  #portal { background:#000; overflow:hidden; }
  #portal-vortex { position:absolute; inset:50% auto auto 50%; width:min(150vmax,1600px); height:min(150vmax,1600px);
    transform:translate(-50%,-50%); background:url('assets/round01.jpg') center/contain no-repeat;
    animation:vortex-spin 48s linear infinite, vortex-pulse 4.5s ease-in-out infinite;
    transition:transform 1.1s cubic-bezier(.6,0,.3,1), opacity 1.1s ease; will-change:transform,opacity; }
  @keyframes vortex-spin  { from{ transform:translate(-50%,-50%) rotate(0deg); } to{ transform:translate(-50%,-50%) rotate(360deg); } }
  @keyframes vortex-pulse { 0%,100%{ filter:brightness(.82) saturate(1); } 50%{ filter:brightness(1.12) saturate(1.25); } }
  @media (prefers-reduced-motion: reduce) { #portal-vortex { animation:none; } }
  #portal.zoom #portal-vortex { transform:translate(-50%,-50%) scale(3.4); opacity:0; }

  /* the dark central hole = the icon stage (counter-rotates so icons sit still on the spinning binary) */
  #portal-stage { position:absolute; inset:50% auto auto 50%; transform:translate(-50%,-50%);
    width:min(78vmin,460px); height:min(78vmin,460px); pointer-events:none; }
  #portal.zoom #portal-stage { opacity:0; transition:opacity .5s ease; }

  .por-ic { position:absolute; transform:translate(-50%,-50%) scale(.4); width:56px; height:56px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; pointer-events:auto;
    border-radius:50%; color:var(--glow); opacity:0; will-change:transform,opacity;
    background:radial-gradient(circle at center, rgba(8,20,16,.55), rgba(8,20,16,.18) 60%, transparent 72%); }
  .por-ic svg { width:30px; height:30px; filter:drop-shadow(0 0 6px var(--glow)) drop-shadow(0 0 14px rgba(95,250,203,.5)); }
  .por-ic.center { width:74px; height:74px; }
  .por-ic.center svg { width:40px; height:40px; }
  .por-ic.drop { animation:ic-drop .7s cubic-bezier(.18,.9,.32,1.3) forwards; }
  @keyframes ic-drop {
    0%   { opacity:0; transform:translate(-50%,-50%) translateY(-46px) scale(.35); }
    70%  { opacity:1; transform:translate(-50%,-50%) translateY(4px)   scale(1.12); }
    100% { opacity:1; transform:translate(-50%,-50%) translateY(0)     scale(1); } }
  .por-ic:hover { color:#bdfff0; }
  .por-ic:hover svg { filter:drop-shadow(0 0 9px #bdfff0) drop-shadow(0 0 20px var(--glow)); }
  .por-ic.center.drop { animation-name:ic-drop-c; }
  @keyframes ic-drop-c {
    0%   { opacity:0; transform:translate(-50%,-50%) translateY(-52px) scale(.4); }
    70%  { opacity:1; transform:translate(-50%,-50%) translateY(5px)   scale(1.16); }
    100% { opacity:1; transform:translate(-50%,-50%) translateY(0)     scale(1); } }
  /* flying clone that docks to the ⋯ corner */
  .dock-fly { position:fixed; z-index:4000; width:56px; height:56px; display:flex; align-items:center; justify-content:center;
    color:var(--glow); pointer-events:none; transition:left .85s cubic-bezier(.5,0,.2,1), top .85s cubic-bezier(.5,0,.2,1), transform .85s ease, opacity .85s ease; }
  .dock-fly svg { width:30px; height:30px; filter:drop-shadow(0 0 8px var(--glow)); }

  .por-hint { position:fixed; left:50%; bottom:6%; transform:translateX(-50%); z-index:30;
    font-family:'IM Fell English','Pirata One',Georgia,serif; font-style:italic; font-size:20px;
    color:rgba(180,200,190,.0); transition:color 1.2s ease; pointer-events:none; letter-spacing:.5px; }
  #portal.ready .por-hint { color:rgba(150,200,180,.7); }

  /* site traffic link — bottom-left corner of the Matrix portal (carried over from the old landing footer) */
  .por-stats { position:fixed; left:14px; bottom:14px; z-index:30; font-family:'IM Fell English',Georgia,serif;
    font-size:13px; letter-spacing:.4px; text-decoration:none; color:rgba(150,200,180,0);
    transition:color 1.2s ease; pointer-events:none; }
  #portal.ready .por-stats { color:rgba(150,200,180,.55); pointer-events:auto; }
  #portal.ready .por-stats:hover { color:var(--glow); }

  /* ---- desktop background (rail + hub live over this) ---- */
  #desktop { background:#07090f; }

  /* ---- Buildings / IFC hub panel (scaffold — extends to full present-landing port) ---- */
  #hub { position:fixed; inset:0; background:rgba(5,7,12,.96); z-index:2800; display:none;
    overflow:auto; padding:48px 18px 80px; }
  #hub.active { display:block; }
  #hub .hub-close { position:fixed; top:14px; right:16px; color:#9aa4b8; font-size:26px; cursor:pointer; z-index:2; }
  #hub h2 { text-align:center; color:var(--blue); letter-spacing:3px; font-weight:700; margin:0 0 6px; }
  #hub .sub { text-align:center; color:#778; font-size:12px; margin-bottom:20px; }
  #hub .hub-sect { max-width:920px; margin:0 auto 22px; }
  #hub .hub-sh { color:#9aa4b8; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; margin:0 4px 10px; }
  /* SMALLER cards (vs the present landing) — fluid grid, mobile-first */
  #hub .hub-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:10px; }
  #hub .hub-card { background:#13131c; border:1px solid rgba(255,255,255,.08); border-radius:10px;
    padding:11px 12px 12px; cursor:pointer; transition:border-color .15s,transform .1s; }
  #hub .hub-card:hover { border-color:rgba(79,195,247,.5); transform:translateY(-1px); }
  #hub .hub-card:active { transform:scale(.98); }
  #hub .hub-card .nm { color:#e6e6ea; font-size:13px; font-weight:600; line-height:1.2; word-break:break-word; }
  #hub .hub-card.cached .nm { color:#4fc97a; }  /* §CACHE-INDICATOR — green name = building DB already in IndexedDB cache */
  #hub .hub-card .mt { color:#7a8294; font-size:10.5px; margin-top:4px; }
  #hub .hub-card .db { display:flex; gap:2px; margin-top:8px; height:5px; }
  #hub .hub-card .db i { display:block; height:100%; border-radius:2px; }
  #hub .hub-import { max-width:920px; margin:0 auto 22px; }
  #hub .hub-drop { display:block; text-align:center; text-decoration:none; border:2px dashed rgba(79,195,247,.4);
    border-radius:12px; padding:20px; color:#4fc3f7; font-weight:600; font-size:14px; cursor:pointer; transition:border-color .15s,background .15s; }
  #hub .hub-drop:hover { border-color:rgba(79,195,247,.7); }
  #hub .hub-drop.drag { border-color:#0277bd; background:rgba(2,119,189,.12); }
  @media (max-width:560px){ #hub .hub-grid { grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px; } }
</style>

<script>
'use strict';
function L(){ console.log.apply(console,['[landing]'].concat([].slice.call(arguments))); }

// ============ screen switch (rail hidden on Morpheus gate + blue end) ============
function show(id){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  if(window._railWrap) _railWrap.style.display = (id==='morpheus'||id==='ended'||id==='portal') ? 'none' : 'flex';
}

// ============ cold/warm probe ============
async function probeColdWarm(){
  let buildings=0, erpdb=0;
  try { buildings = await idbCount('bim_ootb_imports','buildings'); } catch(e){}
  try { const keys = await caches.keys(); erpdb = keys.some(function(k){return /erp|idmp/i.test(k);}) ? 1 : 0; } catch(e){}
  const state = (buildings>0) ? 'warm' : 'cold';
  L('§COLDWARM state='+state+' buildings='+buildings+' erpdb='+erpdb);
  return state;
}
function idbCount(dbName,store){ return new Promise(function(res){
  const rq = indexedDB.open(dbName);
  rq.onerror = function(){ res(0); };
  rq.onsuccess = function(){ const db=rq.result;
    if(!db.objectStoreNames.contains(store)){ db.close(); return res(0); }
    const tx=db.transaction(store,'readonly').objectStore(store).count();
    tx.onsuccess=function(){ res(tx.result); db.close(); };
    tx.onerror=function(){ res(0); db.close(); }; };
  rq.onupgradeneeded=function(){ try{ rq.transaction.abort(); }catch(e){} };
}); }

// ============ AUDIO (orchestral swell + sfx — APPROVED engine, unchanged) ============
let _audioCtx=null, _muted=false;
function ac(){ return (_audioCtx = _audioCtx || new (window.AudioContext||window.webkitAudioContext)()); }
function playOrchestralSwell(){
  if(_muted){ L('§AUDIO muted, skip pad'); return 0; }
  try {
    const a=ac(), t=a.currentTime, ATTACK=2.6, DUR=5.2;
    const master=a.createGain();
    master.gain.setValueAtTime(0.0001,t);
    master.gain.exponentialRampToValueAtTime(0.42,t+ATTACK);
    master.gain.setTargetAtTime(0.0001,t+ATTACK,1.2);
    const lp=a.createBiquadFilter(); lp.type='lowpass';
    lp.frequency.setValueAtTime(110,t);
    lp.frequency.exponentialRampToValueAtTime(900,t+ATTACK);
    lp.Q.value=0.4; lp.connect(master); master.connect(a.destination);
    const fStart=43.65, fEnd=55.0;
    [[0.5,'sine',1.0],[1,'sawtooth',0.8],[1.003,'sawtooth',0.7],[1.5,'triangle',0.4],[2,'triangle',0.3]]
    .forEach(function(s){ const o=a.createOscillator(); o.type=s[1];
      o.frequency.setValueAtTime(fStart*s[0],t); o.frequency.linearRampToValueAtTime(fEnd*s[0],t+ATTACK);
      const g=a.createGain(); g.gain.value=s[2]*0.5; o.connect(g).connect(lp); o.start(t); o.stop(t+DUR+0.1); });
    L('§AUDIO orchestral_pad attack='+ATTACK+' dur='+DUR);
    return ATTACK*1000;
  } catch(e){ L('§AUDIO pad_failed '+e.message); return 0; }
}
// low, dull "bum" — the blue pill's nothing-happens thud (§12.3)
function sfxBum(){ if(_muted){ return; }
  try { const a=ac(), t=a.currentTime, o=a.createOscillator(), g=a.createGain(), lp=a.createBiquadFilter();
    o.type='sine'; o.frequency.setValueAtTime(96,t); o.frequency.exponentialRampToValueAtTime(48,t+0.5);
    lp.type='lowpass'; lp.frequency.value=180;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.32,t+0.04); g.gain.exponentialRampToValueAtTime(0.0001,t+0.85);
    o.connect(lp).connect(g).connect(a.destination); o.start(t); o.stop(t+0.9);
    L('§AUDIO sfx=bum(blue)');
  } catch(e){} }
// per-icon "drop into the scene" cue — short bright pluck, pitch rises with index
function sfxDrop(i){ const a=_audioCtx; if(_muted||!a||a.state!=='running'){ return; }
  try { const t=a.currentTime, o=a.createOscillator(), g=a.createGain();
    o.type='triangle'; const base=523.25*Math.pow(1.0595,(i||0)*2);
    o.frequency.setValueAtTime(base*1.6,t); o.frequency.exponentialRampToValueAtTime(base,t+0.12);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.14,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+0.32);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t+0.34);
  } catch(e){} }
function sfxWhoosh(){ const a=_audioCtx; if(_muted||!a||a.state!=='running'){ return; }
  try { const t=a.currentTime;
    const buf=a.createBuffer(1,Math.floor(a.sampleRate*0.32),a.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.6);
    const src=a.createBufferSource(); src.buffer=buf;
    const bp=a.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=0.8;
    bp.frequency.setValueAtTime(420,t); bp.frequency.exponentialRampToValueAtTime(2600,t+0.28);
    const g=a.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.10,t+0.04); g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
    src.connect(bp).connect(g).connect(a.destination); src.start(t); src.stop(t+0.33);
  } catch(e){} }
function sfxPress(){ const a=_audioCtx; if(_muted||!a||a.state!=='running'){ return; }
  try { const t=a.currentTime, o=a.createOscillator(), g=a.createGain();
    o.type='square'; o.frequency.setValueAtTime(440,t); o.frequency.exponentialRampToValueAtTime(170,t+0.08);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.16,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.13);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t+0.15);
  } catch(e){} }

// ============ BLUE / RED ============
function takeBlue(){ sfxBum(); L('§MORPHEUS_BLUE shown=1 closed=0 (graceful-end) loaded=0 +bum'); show('ended'); }
async function takeRed(){
  try { localStorage.setItem('mx_entered','1'); } catch(e){}   // once in, back/home returns to the circle (not the gate)
  const dur=playOrchestralSwell();
  L('§MORPHEUS_RED audio_unlocked=1 load_started=1');
  enterPortal();                 // the vortex IS the loader — fills screen on black, spins
  warmBehindVortex();            // BACKGROUND cache-warm (bytes only; NO worker spin) behind the spin
  // hold the vortex for the swell, then drop the icons in one-by-one
  await new Promise(function(r){ setTimeout(r, Math.max(1400, dur)); });
  dropIcons();
}

// ============ THE PORTAL ============
function enterPortal(){ show('portal'); L('§PORTAL vortex shown (round01 — the glow is the load)'); }
// HOME / back: return to the matrix circle with the 7 icons (NOT a blank desktop, NOT the red/blue gate).
function showPortalFresh(){
  _picked=false;
  var p=document.getElementById('portal'); if(p){ p.classList.remove('zoom','ready'); }
  var hub=document.getElementById('hub'); if(hub){ hub.classList.remove('active'); }
  show('portal'); dropIcons();
  try { localStorage.setItem('mx_entered','1'); } catch(e){}
  L('§HOME → matrix circle (portal + 7 icons)');
}
// RETURN state (Home / back / nav while warm): the compact ⋯ rail, NOT the grand circle. A REFRESH summons the
// circle (boot). User's choice: refresh for the moment, dots to switch fast.
function showMinimized(){
  _picked=false;
  var p=document.getElementById('portal'); if(p){ p.classList.remove('zoom','ready'); }
  var hub=document.getElementById('hub'); if(hub){ hub.classList.remove('active'); }
  show('desktop'); buildRail();
  if(window._railWrap){ _railWrap.style.display='flex'; _railWrap.style.opacity='1'; }
  try { localStorage.setItem('mx_entered','1'); } catch(e){}
  L('§MINIMIZED → ⋯ rail (return state)');
}
// bfcache restore (browser back arrow to a surface→index nav) = a RETURN → the ⋯ rail (not the gate, not the circle).
window.addEventListener('pageshow', function(e){ if(e.persisted){ L('§BFCACHE restore → ⋯ rail (return)'); showMinimized(); } });

// background warm: stream occt-wasm BYTES into cache + warm shared CDNs. Do NOT instantiate the
// 22MB worker here (lazy-mount law: Bonsai spins only when the tree is clicked).
async function warmBehindVortex(){
  const t0=performance.now();
  try {
    if(window.Bonsai && Bonsai.preload){
      await Bonsai.preload({ assets:[{ key:'occt-wasm', url:'viewer/lib/kernel/occt-wasm.wasm', warm:false }] }, function(){});
      L('§PRELOAD occt bytes cached (worker NOT spun) ms='+Math.round(performance.now()-t0));
    }
  } catch(e){ L('§PRELOAD occt warm skipped '+(e&&e.message||e)); }
  const SHARED=[ 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
    'https://cdn.jsdelivr.net/npm/rtree-sql.js@1.7.0/dist/sql-wasm.js',
    'https://cdn.jsdelivr.net/npm/sql.js-fts5@1.4.0/dist/sql-wasm.js' ];
  await Promise.all(SHARED.map(function(u){ return fetch(u,{mode:'no-cors'}).catch(function(){}); }));
  L('§MORPHEUS_LOAD shared warmed ms='+Math.round(performance.now()-t0));
}

// ---- the 7 launchers (SAME Lucide set, larger in the hole). NO new icons, NO dead tiles. ----
// GPS-dot = Buildings/IFC hub (centre, largest, drops first). Per user: IFC pick → back to the viewer.
function _ic(k){ return (window.ICONS && window.ICONS[k]) ? window.ICONS[k].svg : ''; }
// GPS = centre (largest, drops first). The other 7 ride a ring, evenly spaced (computed, not hand-placed).
var LAUNCHERS=[
  { id:'gps',   key:'grid',       name:'Buildings / IFC', center:true, fn:function(){ openHub(); } },
  { id:'bonsai',key:'bonsaiTree', name:'BIM Modeller',    fn:function(){ launchModeller(); } },
  { id:'erp',   key:'barChart',   name:'ERP',             fn:function(){ go('erp/erp.html'); } },
  { id:'doc',   key:'lightbulb',  name:'User Guide',  fn:function(){ openTab('https://red1oon.github.io/BIMCompiler/USER_GUIDE/'); } },
  { id:'help',  key:'circleHelp', name:'About',           fn:function(){ openAbout(); } },

// §CACHE-INDICATOR — green a building's name if its DB is already in the IndexedDB building cache
// (bim_ootb_cache/dbs, keyed by fetched URL). After Clear cache → no keys → names stay white. Best-effort.
async function _markCachedBuildings(){
  try{
    var keys = await new Promise(function(res){
      var o; try { o = indexedDB.open('bim_ootb_cache'); } catch(e){ return res([]); }
      o.onerror = function(){ res([]); };
      o.onsuccess = function(){
        var db = o.result;
        if(!db.objectStoreNames.contains('dbs')){ db.close(); return res([]); }
        try {
          var rq = db.transaction('dbs','readonly').objectStore('dbs').getAllKeys();
          rq.onsuccess = function(){ db.close(); res(rq.result || []); };
          rq.onerror = function(){ db.close(); res([]); };
        } catch(e){ db.close(); res([]); }
      };
    });
    var keyStr = '\n' + keys.join('\n') + '\n';
    document.querySelectorAll('#hub .hub-card[data-bld]').forEach(function(card){
      var bld = BUILDINGS[card.getAttribute('data-bld')];
      if(!bld || !bld.db){ card.classList.remove('cached'); return; }
      var stem = bld.db.replace(/_extracted\.db$/,'').replace(/\.db$/,'');
      // split builds cache *_meta/_geo/_positions, single caches *_extracted.db — match on the stem boundary
      var hit = keyStr.indexOf('/'+stem+'_') >= 0 || keyStr.indexOf('/'+bld.db) >= 0;
      card.classList.toggle('cached', hit);  // idempotent: green if cached, white if not (handles eviction too)
    });
  }catch(e){ /* indicator is best-effort, never blocks the hub */ }
}

// 8th launcher — Clear cache: drops the entered flag + imports + caches, so the NEXT load shows the
// red/blue gate again. (Mirrors index.html clearAllCache; this is the only thing that re-arms the gate.)
// Reliably empty an IndexedDB even if another tab holds it open: clear every object store.
// (deleteDatabase silently BLOCKS on open connections and the old code treated onblocked as success,
//  so the building cache survived — the reported bug.) Then best-effort delete the now-empty DB.
function _emptyIdb(name){
  return new Promise(function(res){
    var open; try { open = indexedDB.open(name); } catch(e){ return res(); }
    open.onerror = function(){ res(); };
    open.onsuccess = function(){
      var db = open.result;
      try {
        var names = Array.prototype.slice.call(db.objectStoreNames);
        if(!names.length){ db.close(); try{ indexedDB.deleteDatabase(name); }catch(e){} return res(); }
        var tx = db.transaction(names, 'readwrite');
        names.forEach(function(s){ try{ tx.objectStore(s).clear(); }catch(e){} });
        tx.oncomplete = function(){ db.close(); try{ indexedDB.deleteDatabase(name); }catch(e){} res(); };
        tx.onerror = function(){ db.close(); res(); };
        tx.onabort = function(){ db.close(); res(); };
      } catch(e){ try{ db.close(); }catch(_){} res(); }
    };
  });
}

  try { localStorage.removeItem('mx_entered'); localStorage.removeItem('bim_ootb_viewed'); } catch(e){}
