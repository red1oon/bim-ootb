<!DOCTYPE html>
<!-- §VERIFY §MERGE-SPEED — prove/disprove: does collapsing the x-ray building into ONE merged
     unlit depthWrite-off mesh render faster than many transparent meshes, at EQUAL triangle count?
     Measures A1 (63k individual), A2 (~350 instanced, mirrors real x-ray), B (1 merged). -->
<html><head><meta charset="utf-8"><title>merge-speed</title></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script type="module">
import * as THREE from '/viewer/lib/three.module.min.js';

const N      = +(new URLSearchParams(location.search).get('n') || 63000); // elements
const FRAMES = 90, WARM = 25;                                             // timed frames / warmup
const log = (s) => console.log(s);
const results = {};

// deterministic positions in a Hospital-like envelope (101 x 43 x 96), no Math.random
function pos(i){ const a=(i*2654435761>>>0)/4294967296, b=(i*40503>>>0)/4294967296, c=(i*2246822519>>>0)/4294967296;
  return [(-50+a*101), (-21+b*43), (-48+c*96)]; }

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:false });
renderer.setSize(1280,720,false);
const camera = new THREE.PerspectiveCamera(50, 1280/720, 0.5, 2000);
camera.position.set(150,90,180);                 // frame the whole cloud → realistic overdraw
camera.lookAt(0,0,0);
const box = new THREE.BoxGeometry(2.4,2.4,2.4);  // 12 tris each
const TRIS_PER = box.index ? box.index.count/3 : box.attributes.position.count/3;

function light(scene){ const d=new THREE.DirectionalLight(0xffffff,1); d.position.set(1,2,1); scene.add(d); scene.add(new THREE.AmbientLight(0x808080)); }

// ── time a built scene: render FRAMES frames, rotating camera, return median ms ──
async function timeScene(scene, tag){
  renderer.info.reset();
  const samples = [];
  for(let f=0; f<FRAMES; f++){
    const ang = f*0.01; camera.position.set(150*Math.cos(ang),90,180*Math.sin(ang)); camera.lookAt(0,0,0);
    const t0 = performance.now();
    renderer.render(scene, camera);
    renderer.getContext().finish();            // force GPU flush so timing is real
    const dt = performance.now()-t0;
    if(f>=WARM) samples.push(dt);
    await new Promise(r=>requestAnimationFrame(r));
  }
  samples.sort((a,b)=>a-b);
  const med = samples[samples.length>>1], mean = samples.reduce((a,b)=>a+b,0)/samples.length;
  const calls = renderer.info.render.calls, tris = renderer.info.render.triangles;
  log(`§SPEED ${tag} median_ms=${med.toFixed(2)} mean_ms=${mean.toFixed(2)} fps=${(1000/med).toFixed(1)} drawCalls=${calls} tris=${tris}`);
  results[tag] = { med, mean, calls, tris };
}

function disposeScene(s){ s.traverse(o=>{ if(o.isMesh){ if(o.geometry&&o.geometry!==box) o.geometry.dispose(); if(o.material) o.material.dispose(); } }); }

// ── A1: N individual transparent LIT meshes, sortObjects ON (worst case) ──
async function A1(){
  const s = new THREE.Scene(); light(s);
  for(let i=0;i<N;i++){ const m=new THREE.Mesh(box, new THREE.MeshStandardMaterial({color:0x8899aa,transparent:true,opacity:0.3,depthWrite:true,side:THREE.DoubleSide}));
    const p=pos(i); m.position.set(p[0],p[1],p[2]); s.add(m); }
  renderer.sortObjects = true;
  const t0=performance.now();
  await timeScene(s, 'A1_individual_'+N);
  disposeScene(s);
}

// ── A2: ~350 InstancedMeshes (shared geom) transparent LIT, sort ON — mirrors real building x-ray ──
async function A2(){
  const s = new THREE.Scene(); light(s);
  const BUCKETS=350, per=Math.ceil(N/BUCKETS), m4=new THREE.Matrix4();
  let made=0;
  for(let b=0;b<BUCKETS;b++){
    const cnt=Math.min(per, N-made); if(cnt<=0) break;
    const im=new THREE.InstancedMesh(box, new THREE.MeshStandardMaterial({color:0x8899aa,transparent:true,opacity:0.3,depthWrite:true,side:THREE.DoubleSide}), cnt);
    for(let j=0;j<cnt;j++){ const p=pos(made+j); m4.makeTranslation(p[0],p[1],p[2]); im.setMatrixAt(j,m4); }
    im.instanceMatrix.needsUpdate=true; im.frustumCulled=false; s.add(im); made+=cnt;
  }
  renderer.sortObjects = true;
  await timeScene(s, 'A2_instanced350_'+N);
  s.traverse(o=>{ if(o.isInstancedMesh && o.material) o.material.dispose(); });
}

// ── B: ONE merged mesh, FLAT UNLIT, transparent 0.3, depthWrite OFF, sortObjects OFF ──
async function B(){
  const bt0=performance.now();
  const bpos = box.attributes.position, bidx = box.index;
  const vcount = bpos.count, icount = bidx ? bidx.count : 0;
  const outPos = new Float32Array(vcount*3*N);
  const outIdx = icount ? new Uint32Array(icount*N) : null;
  const v=new THREE.Vector3();
  for(let i=0;i<N;i++){
    const p=pos(i), vo=i*vcount*3;
    for(let k=0;k<vcount;k++){ v.fromBufferAttribute(bpos,k); outPos[vo+k*3]=v.x+p[0]; outPos[vo+k*3+1]=v.y+p[1]; outPos[vo+k*3+2]=v.z+p[2]; }
    if(outIdx){ const io=i*icount, base=i*vcount; for(let k=0;k<icount;k++) outIdx[io+k]=bidx.getX(k)+base; }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(outPos,3));
  if(outIdx) g.setIndex(new THREE.BufferAttribute(outIdx,1));
  const build_ms = performance.now()-bt0;
  const heap = (performance.memory ? (performance.memory.usedJSHeapSize/1048576).toFixed(0) : '?');
  log(`§MERGE_BUILD n=${N} build_ms=${build_ms.toFixed(0)} merged_verts=${vcount*N} merged_tris=${(outIdx?outIdx.length:vcount*N)/3} heapMB=${heap}`);
  const s=new THREE.Scene();
  const mat=new THREE.MeshBasicMaterial({color:0x99bbdd,transparent:true,opacity:0.3,depthWrite:false,side:THREE.DoubleSide});
  s.add(new THREE.Mesh(g,mat));
  renderer.sortObjects = false;
  await timeScene(s, 'B_merged1_'+N);
  g.dispose(); mat.dispose();
}

(async()=>{
  try{
    log(`§SPEED_START n=${N} tris_per_elem=${TRIS_PER} canvas=1280x720`);
    await B();   // the one merged mesh — measure its speed directly
    log('§SPEED_DONE');
  }catch(e){ log('§SPEED_ERR '+e.message+' '+e.stack); }
  window.__DONE=true;
})();
</script></body></html>
